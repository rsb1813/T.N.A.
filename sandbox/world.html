<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>T.N.A. sandbox — world</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #info { position: fixed; left: 8px; top: 8px; font: 12px/1.4 ui-monospace, monospace; color: #fff; background: #0008; padding: 4px 8px; border-radius: 4px; white-space: pre; pointer-events: none; }
      #flash { position: fixed; inset: 0; pointer-events: none; background: #fff; opacity: 0; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="flash"></div>
    <div id="info"></div>
    <script type="module" src="./world.ts"></script>
  </body>
</html>
